name: release

# Cut by hand from main. This builds and checks the archives and leaves them
# on a draft release; publishing the draft is what creates the tag, so nothing
# is public until a person decides it is. The module tags (api/vX.Y.Z, verify/vX.Y.Z
# and the rest) are made separately, at the same commit: see CONTRIBUTING.md.
#
# Actions are pinned by commit, with the version they were at in a comment, so that
# what runs with these tokens is what was read. Dependabot keeps the pins current.
#
# Two jobs, so that nothing which runs this repository's code, or its
# dependencies', holds a token that can write a release or sign an attestation.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version without the v, e.g. 0.1.1"
        required: true

permissions:
  contents: read

# Two dispatches at once would both pass the "already exists" check.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      sums: ${{ steps.sums.outputs.sums }}
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: From main, a version number, and not one already cut
        run: |
          set -eu
          [ "$GITHUB_REF" = refs/heads/main ] || { echo "releases are cut from main, not $GITHUB_REF" >&2; exit 1; }
          # Semantic versioning at v0 or v1, as a module tag without /vN needs. Checked here as
          # well as in task dist, so a typo fails before CI runs. grep reads a
          # line at a time, so the characters are checked first.
          case "$VERSION" in *[!0-9A-Za-z.-]*) echo "version has characters a version does not" >&2; exit 1 ;; esac
          id='(0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*)'
          echo "$VERSION" | grep -Eq "^[01]\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-$id(\.$id)*)?\$" || {
            echo "version must look like 0.1.1, without the v; got \"$VERSION\"" >&2
            exit 1
          }
          # The module tags are one version for every module, so one that is
          # already cut for any of them is a version that names other code.
          # A draft has no tag, and only the release job's token can see one.
          if [ -n "$(git tag --list "v$VERSION" "*/v$VERSION")" ]; then
            echo "v$VERSION is already a tag" >&2
            exit 1
          fi

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.work
          # What main's CI cached is not what a release is built from.
          cache: false

      - name: Build pinned tools
        run: |
          mkdir -p bin
          GOWORK=off GOBIN="$PWD/bin" go -C tools install tool

      # Consumers ignore this repository's replace directives, so a plugin that
      # still requires the previous SDK would ship, to them, with the previous SDK.
      - name: Every module requires its siblings at this version
        run: ./bin/task release:check VERSION="$VERSION"

      # The commit passed CI when it merged; this is today's answer, which
      # matters most for the vulnerability scan.
      - name: Everything CI runs
        run: ./bin/task ci

      - name: Build every platform's archive
        run: ./bin/task dist VERSION="$VERSION"

      - name: The archives hold what they should and report their version
        run: ./bin/task dist:check VERSION="$VERSION"

      # The digests travel as a job output, apart from the archives, so the
      # next job can tell that what it downloaded is what was built here.
      - name: Digests
        id: sums
        run: echo "sums=$(base64 -w0 dist/SHA256SUMS)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          retention-days: 7

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # Build provenance: the attestation is signed with the workflow's own
      # identity and stored by GitHub.
      id-token: write
      attestations: write
    env:
      VERSION: ${{ inputs.version }}
      SUMS: ${{ needs.build.outputs.sums }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist

      - name: What was downloaded is what was built
        run: |
          set -eu
          printf '%s' "$SUMS" | base64 -d > "$RUNNER_TEMP/SHA256SUMS"
          (cd dist && sha256sum -c "$RUNNER_TEMP/SHA256SUMS")
          archives=$(find dist -maxdepth 1 \( -name '*.tar.gz' -o -name '*.zip' \) | wc -l)
          [ "$archives" -eq "$(wc -l < "$RUNNER_TEMP/SHA256SUMS")" ] || {
            echo "dist holds archives that were not built" >&2
            exit 1
          }
          cmp dist/SHA256SUMS "$RUNNER_TEMP/SHA256SUMS"

      # Before anything is signed, so a refused run leaves no record behind. The
      # list is taken first: in an `if` a failing gh would read as "no draft".
      - name: Not already a release or a draft
        # The token is in the environment of the two steps that use gh, and of no action.
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -eu
          tags=$(gh release list --limit 200 --json tagName --jq '.[].tagName')
          if printf '%s\n' "$tags" | grep -Fxq "v$VERSION"; then
            echo "v$VERSION already has a release, or a draft" >&2
            exit 1
          fi

      - name: Record how the archives were built
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip

      - name: Draft the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -eu
          # A version with a hyphen is a pre-release and must not become "Latest".
          case "$VERSION" in *-*) pre=--prerelease ;; *) pre= ;; esac
          gh release create "v$VERSION" dist/*.tar.gz dist/*.zip dist/SHA256SUMS \
            --draft $pre --target "$GITHUB_SHA" --title "v$VERSION" --generate-notes
