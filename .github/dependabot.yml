# Small dependency trees matter here. Keeping them current is cheaper than
# auditing them after a CVE lands.
version: 2
updates:
  - package-ecosystem: gomod
    directories:
      - "/api"
      - "/cmd/acciew-agent"
      - "/sdk/go"
      - "/sdk/conformance"
      - "/sdk/examples/minimal"
      - "/verify"
      - "/plugins/keycloak"
      - "/plugins/keycloak/integration"
      - "/plugins/github"
      - "/plugins/awsiam"
      - "/plugins/entra"
      - "/tools"
    schedule:
      interval: weekly
    groups:
      go-dependencies:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
