version: v2

# No managed mode: `option go_package` is written explicitly in the proto so
# that a plugin author who runs protoc themselves, in any language, gets the
# same result we do without needing our buf configuration.
plugins:
  - local: protoc-gen-go
    out: .
    opt: paths=source_relative
  - local: protoc-gen-go-grpc
    out: .
    opt: paths=source_relative
